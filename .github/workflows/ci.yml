name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: Interface JS et vérifications statiques
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: info.json
        run: |
          python3 - <<'PY'
          import json, os
          info = json.load(open("plugin_info/info.json", encoding="utf-8"))
          assert info["id"] == "jsonpoller"
          assert os.path.exists("plugin_info/%s_icon.png" % info["id"]), "icône manquante"
          assert os.path.exists("core/class/%s.class.php" % info["id"]), "classe principale manquante"
          print("ok", info["id"], info["require"])
          PY
      - name: Syntaxe JavaScript
        run: node --check desktop/js/jsonpoller.js
      - name: Tests de l'interface JavaScript
        run: node --test tests/js/*.test.js
      - name: Cohérence des chemins JS <-> daemon Python
        run: python3 -I -m unittest discover -s tests/python -p 'test_js_paths.py' -v
      - name: Compilation Python
        run: python3 -m py_compile resources/jsonpollerd/jsonpollerd.py tests/support/fake_services.py

  python:
    name: Daemon (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # Images Docker officielles : indépendant des versions de Python fournies par l'image du runner
    # (ubuntu-latest n'offre plus Python 3.9, qui est celui de Debian 11, base minimale de Jeedom 4.4).
    container: python:${{ matrix.python }}-slim
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Tests du daemon
        run: python -I -m unittest discover -s tests/python -v

  php:
    name: Plugin (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring, posix
          coverage: none
      - name: Syntaxe PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Tests unitaires
        run: php tests/php/unit.php
      - name: Test d'intégration (vrai daemon)
        run: php tests/php/integration.php

  browser:
    name: Fenêtre de sélection (navigateur)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bibliothèques de la page (jQuery, Bootstrap 3, bootbox, Font Awesome)
        run: npm ci --no-audit --no-fund
      - name: Playwright + Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Tests dans Chromium
        run: node --test --test-reporter=spec explorer.e2e.js
